# IntelliJ Platform Plugin Configuration
pluginGroup = com.luapanda.idea
pluginName = LuaPanda
pluginVersion = 1.0.2

# Marketplace vendor info — patched into plugin.xml at build time.
# Must be a real, monitored mailbox: JetBrains uses it for review feedback,
# and it is displayed publicly on the plugin page.
pluginVendorName = LuaPanda
pluginVendorEmail = 1963249614@qq.com
pluginVendorUrl = https://github.com/MrHQK/LuaPanda-IDEA-Plugin

# IntelliJ Platform Properties
platformType = IC
platformVersion = 2024.1

# Kotlin & Java
kotlinVersion = 2.1.0
javaVersion = 17

# The Kotlin stdlib bundled with the IntelliJ Platform must be used at runtime;
# excluding the Gradle-added one avoids ClassNotFoundException / version clashes.
kotlin.stdlib.default.dependency = false

# Gradle
org.gradle.jvmargs = -Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
# NOTE: intentionally NOT set here. A hard-coded absolute path gets published with
# the repo and makes the build fail on every other machine. Use JAVA_HOME instead,
# or put `org.gradle.java.home=<path>` in your per-user ~/.gradle/gradle.properties
# (never committed), or pass -Dorg.gradle.java.home=<path> on the command line.
