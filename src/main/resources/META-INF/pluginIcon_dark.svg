<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- LuaPanda plugin logo (40x40, dark theme) -->
  <rect width="40" height="40" rx="9" ry="9" fill="#31344A"/>
  <!-- ears -->
  <circle cx="13.5" cy="13.5" r="6" fill="#F5F5F5"/>
  <circle cx="26.5" cy="13.5" r="6" fill="#F5F5F5"/>
  <!-- head -->
  <ellipse cx="20" cy="22.5" rx="11.5" ry="10.5" fill="#F5F5F5"/>
  <!-- eye patches -->
  <ellipse cx="15.2" cy="20.5" rx="3.5" ry="4.3" fill="#31344A" transform="rotate(-16 15.2 20.5)"/>
  <ellipse cx="24.8" cy="20.5" rx="3.5" ry="4.3" fill="#31344A" transform="rotate(16 24.8 20.5)"/>
  <!-- eye highlights -->
  <circle cx="15.9" cy="19.9" r="1.3" fill="#F5F5F5"/>
  <circle cx="24.1" cy="19.9" r="1.3" fill="#F5F5F5"/>
  <!-- nose -->
  <ellipse cx="20" cy="27" rx="2.1" ry="1.5" fill="#31344A"/>
</svg>
